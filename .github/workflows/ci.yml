name: Pipeline CI de Pruebas Unitarias

on:
  push:
    branches: [ "feature/test-unitarios", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar codigo del repositorio
      uses: actions/checkout@v3

    - name: Configurar ambiente Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Ejecutar pruebas unitarias con Maven
      run: mvn test

    - name: Publicar reporte de pruebas Surefire
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: reporte-pruebas-surefire
        path: target/surefire-reports/
        